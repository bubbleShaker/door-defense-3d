<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>営業おことわり！</title>
  <link data-trunk rel="rust" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  <style>
    html, body { margin: 0; height: 100%; background: #1b2230; overflow: hidden; touch-action: none; }
    #wrap { position: fixed; inset: 0; }
    #game { width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #f4efe6; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; gap: 12px; pointer-events: none;
    }
    #loading h1 { margin: 0; font-size: clamp(28px, 6vw, 56px); letter-spacing: .05em; }
    #loading p { margin: 0; opacity: .75; }
  </style>
</head>
<body>
  <div id="loading"><h1>営業おことわり！</h1><p>読み込み中…（初回は少し時間がかかります）</p></div>
  <div id="wrap"><canvas id="game" tabindex="0"></canvas></div>
  <script>
    // Bevy が描画を始めたらローディング表示を消す
    const obs = setInterval(() => {
      const c = document.getElementById('game');
      if (c && c.width > 300) { document.getElementById('loading').remove(); clearInterval(obs); }
    }, 300);
  </script>
</body>
</html>
