[package]
name = "door-defense-3d"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui", "audio", "wav"] }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
